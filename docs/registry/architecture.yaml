# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: ai_game_state
    status: active
    pattern: direct_call     # C7 每次 AI 决策前构造 game_state Dictionary 传入
    producer: game-state-machine   # C7 make_game_state()
    consumers:
      - ai-player            # SMART 跟牌分支①②③ + score_play v_pts 全依赖
    adr: docs/architecture/adr-0005-card-memory-state-management.md
    signal_signature: "make_game_state() -> Dictionary 须含: current_trick_plays[{seat_id,cards,pattern,play_order}], attack_team, defend_team, trump_suit, current_rank, dealer_seat, attack_score, 及 CardMemory 读取入口"
    referenced_by:
      - docs/architecture/adr-0005-card-memory-state-management.md
    added: 2026-09-05
    revised: ""
  - contract: legal_plays_enumeration
    status: active
    pattern: direct_call     # AI 决策时同步调用 C2 枚举器,返回合法出牌候选集
    producer: play-validation   # C2 PlayValidator.get_legal_plays()
    consumers:
      - ai-player            # SMART 评分流水线遍历候选; 生成器与校验器同源
    adr: docs/architecture/adr-0006-get-legal-plays-enumeration.md
    signal_signature: "get_legal_plays(hand, lead: PatternResult?, trump_suit, current_rank, rule_config) -> Array[Array[Card]]; lead=null 枚举首出/lead≠null 枚举跟牌; 全序排序(deck_id tie-break); 甩牌只校验 shape 不校验最大性(不碰 other_hands)"
    referenced_by:
      - docs/architecture/adr-0006-get-legal-plays-enumeration.md
    added: 2026-09-05
    revised: ""

